name: Mise à jour du site

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 h (heure UTC, GitHub peut retarder de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow »
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write         # pour enregistrer l'état dans la branche « data »
    steps:
      - uses: actions/checkout@v5
      - name: Récupérer l'état précédent (branche data)
        uses: actions/checkout@v5
        continue-on-error: true   # normal au tout premier lancement : la branche n'existe pas encore
        with:
          ref: data
          path: state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Enregistrer l'état (branche data, un seul commit)
        run: |
          mkdir /tmp/s && cp site/data/articles.json /tmp/s/ && cp -r site/data/logos /tmp/s/logos && cd /tmp/s
          git init -q -b data && git add articles.json logos
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "état $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
