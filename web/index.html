<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1923" media="(prefers-color-scheme: dark)">
<title>TechInfo — veille tech</title>
<meta name="description" content="Agrégateur d'actualités tech : titres et liens vers les sources, classés par règles, sans IA.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311202e'/%3E%3Cpath d='M8 10h16M16 10v13' stroke='%236cc4e0' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<a class="skip" href="#list">Aller aux actualités</a>
<header id="top">
  <div class="bar">
    <h1>TechInfo</h1>
    <input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher dans les actualités" enterkeyhint="search">
    <button id="filterBtn" type="button" aria-expanded="false" aria-controls="filters">Filtres</button>
  </div>
  <div id="filters">
    <select id="level" aria-label="Importance">
      <option value="">Toutes importances</option><option value="critical">Critique</option><option value="important">Important</option><option value="follow">À suivre</option><option value="minor">Mineur</option>
    </select>
    <label><input id="unread" type="checkbox"> Non lus</label>
    <label><input id="byscore" type="checkbox"> Par pertinence</label>
  </div>
  <div id="chips" aria-label="Catégories"></div>
</header>
<div class="layout">
  <nav id="nav" aria-label="Rubriques"></nav>
  <main>
    <p id="status" role="status"></p>
    <section id="list" tabindex="-1"></section>
    <button id="more" type="button" hidden>Voir plus</button>
  </main>
</div>
<footer id="foot"></footer>
<nav id="tabbar" aria-label="Navigation principale"></nav>
<dialog id="menu" aria-label="Plus d'options"></dialog>
<script src="./app.js" type="module"></script>
</body>
</html>
