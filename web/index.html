<!doctype html>
<html lang="fr" data-theme="auto" data-size="m" data-density="comfortable" data-summary="3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1923" media="(prefers-color-scheme: dark)">
<meta name="description" content="Tech news aggregator · Agrégateur d'actualités tech : titres, résumés et liens vers les sources, classés par règles.">
<title>TechInfo</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TechInfo">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<a class="skip" href="#list" data-i18n="skip">Aller aux actualités</a>
<header id="top">
  <div class="bar">
    <img class="logo" src="./icons/icon-192.png" alt="" width="34" height="34">
    <h1>TechInfo</h1>
    <nav id="tabbar" data-i18n-aria="tabsAria"></nav>
    <input id="q" type="search" data-i18n-ph="search" data-i18n-aria="searchAria" enterkeyhint="search">
    <button id="filterBtn" type="button" aria-expanded="false" aria-controls="filters"></button>
  </div>
  <div id="filters"></div>
  <div id="chips" data-i18n-aria="chipsAria" hidden></div>
</header>
<main>
  <div id="subtabs" data-i18n-aria="subtabsAria" hidden></div>
  <div id="banner" hidden></div>
  <div id="extras" hidden></div>
  <p id="status" role="status"></p>
  <section id="list" tabindex="-1"></section>
  <div id="sentinel" aria-hidden="true"></div>
  <button id="more" type="button" hidden data-i18n="more"></button>
</main>
<footer id="foot"></footer>
<button id="fresh" type="button" hidden></button>
<div id="toast" role="status" hidden></div>
<dialog id="welcome" aria-labelledby="welcome-title"></dialog>
<dialog id="stories" data-i18n-aria="storiesAria"></dialog>
<script src="./app.js" type="module"></script>
</body>
</html>
